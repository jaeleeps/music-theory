<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Examples</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1d1b18; --muted: #6b665d;
    --line: #e2ddd2; --accent: #7a3b2e; --warn-bg: #fdecea; --warn-ink: #8a1c12;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1a18; --card: #fbfaf7; --ink: #ece8e0; --muted: #a39d92;
      --line: #3a3833; --accent: #e0a08f; --warn-bg: #3b1f1c; --warn-ink: #ffb4a8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1a18; --card: #fbfaf7; --ink: #ece8e0; --muted: #a39d92;
    --line: #3a3833; --accent: #e0a08f; --warn-bg: #3b1f1c; --warn-ink: #ffb4a8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--ink);
    font: 16px/1.55 Georgia, "Times New Roman", serif;
  }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .intro { color: var(--muted); margin: 0 0 24px; }
  section.example { margin: 0 0 32px; }
  section.example h2 { font-size: 1.15rem; margin: 0 0 6px; }
  .caption { margin: 0 0 10px; }
  /* The score always sits on a light "paper" card. abcjs draws with currentColor,
     so the paper sets its own dark ink; otherwise dark mode's light text color
     would draw light notes on light paper. */
  .paper { background: var(--card); color: #1d1b18; border: 1px solid var(--line); border-radius: 8px; padding: 8px; overflow-x: auto; }
  .paper svg { display: block; }
  .controls { margin-top: 8px; display: flex; gap: 8px; align-items: center; }
  button {
    font: inherit; font-size: 0.95rem; padding: 6px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--accent); background: transparent; color: var(--accent);
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .warn { margin-top: 8px; padding: 8px 12px; border-radius: 6px; background: var(--warn-bg); color: var(--warn-ink); font: 0.85rem/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap; }
  .notes { color: var(--muted); font-size: 0.95rem; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>TITLE</h1>
  <p class="intro">INTRO</p>

  <!-- EXAMPLES: copy the section below once per musical example. Put raw ABC inside
       its text/vnd.abc script element. No JS escaping is applied there, so a "\n" in an
       annotation stays a literal ABC line break. Never write a closing script tag in ABC. -->
  <section class="example">
    <h2>Example title</h2>
    <p class="caption">What to look at in this example.</p>
    <script type="text/vnd.abc">
X:1
M:4/4
L:1/4
K:C
CDEF | G4 |]
    </script>
    <p class="notes">Optional: pitches spelled out in text, e.g. C4 D4 E4 F4 | G4.</p>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.7.1/abcjs-basic-min.js"></script>
<script>
(function () {
  // --- playback: a small WebAudio synth, no soundfont download needed ---
  var ctx = null, playing = [];
  function stopAll() {
    playing.forEach(function (o) { try { o.stop(); } catch (e) {} });
    playing = [];
  }
  function play(visualObj, bpm) {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") ctx.resume();
    stopAll();
    // setUpAudio gives note events with start/duration in whole notes.
    var audio = visualObj.setUpAudio();
    var wholeNote = 4 * 60 / bpm, t0 = ctx.currentTime + 0.05;
    audio.tracks.forEach(function (track) {
      track.forEach(function (ev) {
        if (ev.cmd !== "note" || ev.pitch === undefined) return;
        var start = t0 + ev.start * wholeNote, dur = Math.max(ev.duration * wholeNote, 0.08);
        var osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.value = 440 * Math.pow(2, (ev.pitch - 69) / 12);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.18, start + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        osc.connect(gain).connect(ctx.destination);
        osc.start(start); osc.stop(start + dur + 0.02);
        playing.push(osc);
      });
    });
  }

  // --- render every ABC block ---
  document.querySelectorAll('script[type="text/vnd.abc"]').forEach(function (src) {
    var paper = document.createElement("div");
    paper.className = "paper";
    src.after(paper);

    if (!window.ABCJS) {
      paper.textContent = "The notation library could not load. ABC source:\n" + src.textContent;
      paper.style.whiteSpace = "pre-wrap";
      return;
    }
    var visualObj = ABCJS.renderAbc(paper, src.textContent.trim(), {
      responsive: "resize", add_classes: true, paddingtop: 8, paddingbottom: 8
    })[0];

    // Parse warnings mean the ABC is wrong: show them, never hide them.
    if (visualObj.warnings && visualObj.warnings.length) {
      var w = document.createElement("div");
      w.className = "warn";
      w.textContent = "Notation warnings (this example may be drawn wrong):\n" +
        visualObj.warnings.map(function (s) { return s.replace(/<[^>]+>/g, ""); }).join("\n");
      paper.after(w);
    }

    var controls = document.createElement("div");
    controls.className = "controls";
    var q = /^Q:\s*(?:\d+\/\d+=)?(\d+)/m.exec(src.textContent);
    var bpm = q ? Number(q[1]) : 80;
    var playBtn = document.createElement("button");
    playBtn.type = "button"; playBtn.textContent = "▶ Play";
    playBtn.onclick = function () { play(visualObj, bpm); };
    var stopBtn = document.createElement("button");
    stopBtn.type = "button"; stopBtn.textContent = "■ Stop";
    stopBtn.onclick = stopAll;
    controls.append(playBtn, stopBtn);
    paper.after(controls);
  });
})();
</script>
</body>
</html>
